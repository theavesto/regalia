/* ================= main: actions, events, routing ================= */
const EMPTY_FILTERS = () => ({ q: '', period: 'all', from: '', to: '', type: 'all', acc: '', cat: '' });
function findTx(id) { const st = S(); return st.txs.find(t => t.id === id) || st.trash.find(t => t.id === id); }
function applyTheme() {
  const t = (D.settings && D.settings.theme) || 'dark';
  const r = document.documentElement;
  r.classList.toggle('force-light', t === 'light');
  r.classList.toggle('force-dark', t === 'dark');
}
let toastTimer;
function toast(msg, opts = {}) {
  const el = $('#toast');
  if (!el) return;
  el.replaceChildren();
  const t = document.createElement('span');
  t.textContent = msg;
  el.appendChild(t);
  if (opts.action) {
    const b = document.createElement('button');
    b.className = 'toast-act';
    b.textContent = opts.action;
    b.addEventListener('click', ev => { ev.stopPropagation(); el.classList.remove('show'); opts.onAction(); });
    el.appendChild(b);
  }
  el.classList.toggle('error', !!opts.error);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), opts.action ? 5500 : 2600);
}
function route() {
  const h = (location.hash || '').replace('#', '');
  if (TAB_DEFS[h] || h === 'more') { UI.tab = h; UI.sub = null; }
  else if (SUBS[h]) { UI.tab = 'more'; UI.sub = h; }
  else if (!h) { UI.tab = 'feed'; UI.sub = null; }
}
function go(tab, sub = null) {
  UI.tab = tab; UI.sub = sub;
  hideTip();
  const h = sub || tab;
  if ((location.hash || '').slice(1) !== h) {
    try { location.hash = h; } catch (e) { render(); }
  } else render();
}
const roundPlan = v => (curInfo(mainCur()).dec === 0 && v > 10000 ? Math.round(v / 1000) * 1000 : Math.round(v));

/* ---------- sheet helpers ---------- */
function txSetType(s, type) {
  const st = s.st;
  if (st.type === type) return;
  const prevType = st.type;
  st.type = type; st.err = ''; st.sug = false;
  if (type === 'transfer') {
    st.outAcc = (prevType === 'transfer' ? st.outAcc : st.acc) || st.outAcc || defaultAcc('transfer');
    if (!st.inAcc || st.inAcc === st.outAcc) st.inAcc = otherAcc(st.outAcc);
    st.amt2Touched = false;
    autoAmt2(st);
  } else {
    st.acc = (prevType === 'transfer' ? st.outAcc : st.acc) || defaultAcc(type);
  }
  if (type === 'expense' || type === 'income') {
    const c = D.categories.get(st.cat);
    if (c && c.kind !== type) { st.cat = null; st.catManual = false; }
    st.parts = null;
  }
  renderSheet(s);
}
function updatePartsRem(s) {
  const el = $(`.sheet-wrap[data-sid="${s.id}"] #parts-rem`);
  if (!el) return;
  const rem = partsRemaining(s.st);
  el.textContent = Math.abs(rem) > 0.009 ? `не распределено ${money(rem, txCur(s.st))}` : 'всё распределено';
  el.classList.toggle('warn', Math.abs(rem) > 0.009);
}
function recSave(s) {
  const a = D.accounts.get(s.props.id);
  if (!a) { Sheets.close(s); return; }
  const v = balTarget(a.type, s.st.expr);
  if (!isFinite(v)) return sheetErr(s, a.type === 'loan' ? 'Впишите, сколько должны сейчас' : 'Впишите, сколько на счёте сейчас');
  const diff = round2(v - (S().bal.get(a.id) || 0));
  Sheets.close(s);
  if (Math.abs(diff) < 0.005) { toast('Остаток уже совпадает'); return; }
  toast(toastFix(diff, a.cur, s.st.balMode));
  return saveTx(balanceFixTx(a.id, diff, s.st.balMode), null);
}
function budSave(s) {
  const { id, m, kind } = s.props;
  const v = s.st.expr === '' ? 0 : round2(parseNum(s.st.expr));
  if (!isFinite(v) || v < 0) return sheetErr(s, 'Введите сумму');
  Sheets.close(s);
  toast(v ? 'План сохранён' : 'План убран');
  return setBudgetCats(m, { [id]: { [kind === 'income' ? 'i' : 'o']: v } });
}
function budCopy(mode) {
  const m = UI.budMonth, prev = addMonths(m, -1);
  const cats = {};
  if (mode === 'plan') {
    for (const [id, v] of Object.entries(effBudget(prev))) if ((v.o || 0) > 0 || (v.i || 0) > 0) cats[id] = { o: v.o || 0, i: v.i || 0 };
  } else {
    const f = monthFacts(prev);
    for (const [id, v] of rollup(f.exp)) if (id && v > 0) cats[id] = { ...(cats[id] || {}), o: roundPlan(v) };
    for (const [id, v] of rollup(f.inc)) if (id && v > 0) cats[id] = { ...(cats[id] || {}), i: roundPlan(v) };
  }
  if (!Object.keys(cats).length) { toast('Копировать нечего'); return; }
  const run = () => { toast('План заполнен'); setBudgetCats(m, cats, true); };
  const hasCur = Object.values(effBudget(m)).some(v => (v.o || 0) > 0 || (v.i || 0) > 0);
  if (hasCur) Sheets.open('confirm', { title: 'Заменить план?', text: `На ${monthTitle(m).toLowerCase()} план уже есть. Заменить его?`, ok: 'Заменить', onOk: run });
  else run();
}
function payeeTxs(key) {
  const st = S();
  return st.txs.concat(st.trash).filter(t => (t.type === 'expense' || t.type === 'income') && t.payee && t.payee.trim().toLowerCase() === key);
}
async function payeeSave(s) {
  const key = s.props.key;
  const name = (s.st.name || '').trim();
  if (!name) return sheetErr(s, 'Введите название');
  const old = (S().payees.get(key) || {}).name;
  Sheets.close(s);
  if (name === old) return;
  toast('Получатель переименован');
  await patchMany(payeeTxs(key), t => ({ ...t, payee: name }));
}
function payeeClear(s) {
  const key = s.props.key;
  const n = payeeTxs(key).length;
  Sheets.open('confirm', {
    title: 'Убрать получателя?', text: `Получатель исчезнет из ${n} ${plural(n, 'операции', 'операций', 'операций')}, сами операции останутся.`, ok: 'Убрать', danger: true,
    onOk: async () => { Sheets.close(s); toast('Получатель убран'); await patchMany(payeeTxs(key), t => ({ ...t, payee: null })); },
  });
}
function rateSave(s) {
  const cur = s.props.cur;
  const v = parseNum(s.st.expr);
  if (!(v > 0)) return sheetErr(s, 'Введите курс больше нуля');
  Sheets.close(s);
  toast('Курс сохранён');
  return saveSettings({ rates: { ...(D.settings.rates || {}), [cur]: { r: Math.round(v * 10000) / 10000, d: today(), manual: true } } });
}
function debtSettle(s) {
  const e = S().debts.get(s.props.key);
  if (!e) return;
  const list = Object.entries(e.byCur).filter(([, x]) => Math.abs(x) >= 0.005);
  if (!list.length) return;
  const [cur, v] = list[0];
  const acc = accountsSorted().find(a => a.cur === cur);
  const sch = debtSchedule(e);
  if (s) Sheets.close(s);
  openTx({ type: 'debt', debtKind: v > 0 ? 'collect' : 'repay', payee: e.name, amount: sch && sch.next ? round2(sch.next.left) : Math.abs(v), acc: acc ? acc.id : undefined });
}
async function offerFile(filename, data, title) {
  if (D.mode === 'db' && !D.downloads && window.claude) { try { D.downloads = await window.claude.use('downloads'); } catch (e) { D.downloads = null; } }
  if (D.downloads) {
    try { await D.downloads.save({ filename, data }); toast('Файл сохранён'); return; }
    catch (e) {
      const code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') { toast('Окно сохранения уже открыто, попробуйте через минуту'); return; }
    }
  }
  if (!window.claude) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Файл сохранён');
      return;
    } catch (e) { /* fall through */ }
  }
  Sheets.open('exportText', { title, filename, data: data.replace(/^﻿/, '') });
}
async function onImportFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const counts = validateBackup(j);
    Sheets.open('importConfirm', { data: j, counts });
  } catch (e) {
    toast(e && e.message === 'Это не резервная копия Regalia' ? e.message : 'Не удалось прочитать файл: нужна резервная копия Regalia (.json)', { error: true });
  }
  input.value = '';
}
function importRun(el, s) {
  const mode = el.dataset.v;
  const data = s.props.data;
  const run = async () => {
    toast('Восстанавливаю данные…');
    try { await importBackup(data, mode); toast('Данные восстановлены'); go('feed'); }
    catch (e) { toast('Не удалось восстановить: ' + ((e && e.message) || 'ошибка'), { error: true }); }
  };
  Sheets.close(s);
  if (mode === 'replace' && (D.accounts.size || S().txs.length)) {
    Sheets.open('confirm', { title: 'Заменить все данные?', text: 'Текущие счета, категории, бюджеты и операции удалятся, вместо них загрузятся данные из файла. Отменить это нельзя.', ok: 'Заменить', danger: true, onOk: run });
  } else run();
}

const GUARANTEE_UZS = 2e8;
const fmtR = v => String(Math.round((+v || 0) * 100) / 100).replace('.', ',');
const rateText = (r, r2) => (r2 && r2 !== r ? `${fmtR(r)}-${fmtR(r2)}%` : `${fmtR(r)}%`);
function termText(m) {
  m = Math.round(+m || 0);
  if (!m) return '';
  if (m >= 12 && m % 12 === 0) { const y = m / 12; return `${y} ${plural(y, 'год', 'года', 'лет')}`; }
  return `${m} ${plural(m, 'месяц', 'месяца', 'месяцев')}`;
}
function addMonthsISO(iso, n) {
  const [y, m, d] = String(iso).split('-').map(Number);
  const mk = addMonths(`${y}-${pad(m)}`, n);
  return `${mk}-${pad(Math.min(d || 1, daysInMonth(mk)))}`;
}
function monthsBetween(a, b) {
  const [y1, m1, d1] = String(a).split('-').map(Number), [y2, m2, d2] = String(b).split('-').map(Number);
  let n = (y2 - y1) * 12 + (m2 - m1);

}
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
function safeUrl(u) { const s = String(u || ''); return /^https:\/\/[^\s"'<>]+$/.test(s) ? s : ''; }

/* deposit: monthly accrual, with or without capitalization, optional monthly top-up */
function depositCalc({ amount, rate, months, cap, topup = 0 }) {
  const i = (+rate || 0) / 1200;
  months = Math.max(1, Math.min(600, Math.round(+months || 1)));
  let bal = +amount || 0, interest = 0;
  const rows = [];
  for (let k = 1; k <= months; k++) {
    const inc = bal * i;
    interest += inc;
    if (cap) bal += inc;
    rows.push({ k, inc, bal });
    if (topup > 0 && k < months) bal += topup;
  }
  const put = (+amount || 0) + (topup > 0 ? topup * (months - 1) : 0);
  const total = cap ? bal : bal + interest;
  return { rows, interest, put, total, eff: cap ? (Math.pow(1 + i, 12) - 1) * 100 : +rate || 0 };
}

/* loan: annuity or differentiated payments, optional extra monthly payment that shortens the term */
function annuity(P, rate, n) {
  const i = (+rate || 0) / 1200;
  n = Math.max(1, Math.round(n));
  return i ? P * i / (1 - Math.pow(1 + i, -n)) : P / n;
}
function loanSchedule({ amount, rate, months, type = 'ann', start = today(), extra = 0 }) {
  const P = +amount || 0;
  const n = Math.max(1, Math.min(600, Math.round(+months || 1)));
  const i = (+rate || 0) / 1200;
  const A = annuity(P, rate, n);
  const base = P / n;
  let rest = P, totalInt = 0, totalPay = 0;
  const rows = [];
  for (let k = 1; rest > 0.005 && k <= 600; k++) {
    const int = rest * i;
    let princ = (type === 'diff' ? base : A - int) + (extra > 0 ? extra : 0);
    if (!(princ > 0)) break;
    princ = Math.min(rest, princ);
    const pay = princ + int;
    rest -= princ;
    totalInt += int; totalPay += pay;
    rows.push({ k, date: addMonthsISO(start, k), pay, int, princ, rest: Math.max(0, rest) });
  }
  return { rows, first: rows.length ? rows[0].pay : 0, last: rows.length ? rows[rows.length - 1].pay : 0, totalInt, totalPay, months: rows.length, A };
}

function nextMonthlyDate(anchor, from) {
  if (!anchor) return null;
  const day = Number(String(anchor).slice(8, 10)) || 1;
  let mk = monthKey(from);
  for (let k = 0; k < 4; k++) {
    const d = `${mk}-${pad(Math.min(day, daysInMonth(mk)))}`;
    if (d >= from && d > anchor) return d;
    mk = addMonths(mk, 1);
  }
  return null;
}

/* deposit account forecast */
function depositInfo(a) {
  const bal = S().bal.get(a.id) || 0;
  if (!(a.rate > 0) || bal <= 0) return null;
  const end = a.opened && a.term ? addMonthsISO(a.opened, a.term) : null;
  const left = end ? Math.max(0, monthsBetween(today(), end)) : null;
  const monthly = bal * a.rate / 1200;
  const calc = left ? depositCalc({ amount: bal, rate: a.rate, months: left, cap: !!a.cap }) : null;
  return { bal, end, left, monthly, total: calc ? calc.total : null, interest: calc ? calc.interest : null };
}
/* loan account: next payment and its split, from what is still owed */
function loanInfo(a) {
  const bal = S().bal.get(a.id) || 0;
  const rest = Math.max(0, -bal);
  if (rest < 0.5) return null;
  const elapsed = a.opened ? Math.max(0, monthsBetween(a.opened, today())) : 0;
  const leftMonths = a.term ? Math.max(1, a.term - elapsed) : null;
  const next = a.opened ? nextMonthlyDate(a.opened, today()) : null;
  const int = rest * (+a.rate || 0) / 1200;
  let pay = null;
  if (leftMonths) pay = a.payType === 'diff' ? rest / leftMonths + int : annuity(rest, a.rate || 0, leftMonths);
  return { rest, next, pay, int, princ: pay ? Math.max(0, pay - int) : null, leftMonths, end: a.opened && a.term ? addMonthsISO(a.opened, a.term) : null };
}
const bankKey = b => String(b || '').trim().toLowerCase().replace(/\s+/g, ' ');
function bankDepositsUZS(bank, exceptId) {
  const k = bankKey(bank);
  if (!k) return 0;
  let sum = 0;
  for (const a of D.accounts.values()) {
    if (a.type !== 'deposit' || a.archived || a.id === exceptId || bankKey(a.bank) !== k) continue;
    sum += conv(Math.max(0, S().bal.get(a.id) || 0), a.cur, 'UZS');
  }
  return sum;
}
function knownBanks() {
  const s = new Set();
  const m = MKT();
  for (const d of m.deposits || []) if (d && d.b) s.add(String(d.b));
  for (const l of m.loans || []) if (l && l.b) s.add(String(l.b));
  for (const a of D.accounts.values()) if (a.bank) s.add(a.bank);
  return [...s].sort((a, b) => a.localeCompare(b, 'ru'));

function depFlags(d) {

/* ================= plans: regular payments, debts with terms, goals, forecast, habit stats ================= */
const FREQ = {
  day: { every: 'каждый день', unit: ['день', 'дня', 'дней'] },
  week: { every: 'каждую неделю', unit: ['неделю', 'недели', 'недель'] },
  month: { every: 'каждый месяц', unit: ['месяц', 'месяца', 'месяцев'] },
  year: { every: 'каждый год', unit: ['год', 'года', 'лет'] },

const WD_ACC = ['в воскресенье', 'в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу'];
const plainItem = x => { const o = { ...x }; delete o.id; return o; };

function freqText(p) {
  const n = Math.max(1, p.every || 1);
  const f = FREQ[p.freq] || FREQ.month;
  const d = parseISO(p.start || today());
  let when = '';
  if (p.freq === 'month') when = `, ${d.getDate()} числа`;
  else if (p.freq === 'week') when = `, ${WD_ACC[d.getDay()]}`;
  else if (p.freq === 'year') when = `, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
  return (n === 1 ? f.every : `раз в ${n} ${plural(n, ...f.unit)}`) + when;
}
function planDates(p, from, to, limit = 500) {
  const out = [];

  const every = Math.max(1, Math.round(p.every || 1));
  const end = p.end && p.end < to ? p.end : to;
  if (p.start > end) return out;
  if (p.freq === 'day' || p.freq === 'week') {
    const step = (p.freq === 'week' ? 7 : 1) * every;
    let d = p.start;
    if (d < from) d = addDays(d, Math.floor(daysBetween(d, from) / step) * step);
    while (d <= end && out.length < limit) { if (d >= from) out.push(d); d = addDays(d, step); }
    return out;
  }
  const months = (p.freq === 'year' ? 12 : 1) * every;
  let n = p.start < from ? Math.max(0, Math.floor(monthsBetween(p.start, from) / months) - 1) : 0;
  for (let guard = 0; guard < 2000 && out.length < limit; guard++, n++) {
    const x = addMonthsISO(p.start, n * months);
    if (x > end) break;
    if (x >= from) out.push(x);
  }
  return out;
}
const planSince = p => (p.since && p.since > p.start ? p.since : p.start);
function planPending(from, to) {
  const res = [];
  const t = today();
  for (const p of D.plans.values()) {
    if (p.paused) continue;
    const lo = planSince(p) > from ? planSince(p) : from;
    for (const d of planDates(p, lo, to)) {
      if (p.done && p.done[d]) continue;
      res.push({ p, date: d, overdue: d < t });
    }
  }
  return res.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : planMain(b.p) - planMain(a.p)));
}
function planMain(p) { return conv(+p.amt || 0, accCur(p.acc)); }
function planMonthly(p) {
  const n = Math.max(1, p.every || 1);
  const v = planMain(p);
  switch (p.freq) {

    case 'week': return v * 4.345 / n;
    case 'year': return v / 12 / n;
    default: return v / n;
  }
}
function planTitle(p) {
  if (p.name) return p.name;
  if (p.type === 'transfer') return `Перевод на ${accName(p.to)}`;
  const c = D.categories.get(p.cat);
  return p.payee || (c ? c.name : (p.type === 'income' ? 'Доход' : 'Платёж'));
}
function planIcon(p) {
  if (p.type === 'transfer') return { icon: icon('swap'), color: NEUTRAL };
  const c = D.categories.get(p.cat);
  return { icon: gi(c ? c.icon : 'g:calendar'), color: c ? c.color : NEUTRAL };
}
function planMark(p, date, value) {
  const done = { ...(p.done || {}) };
  const cut = addMonthsISO(today(), -14);
  for (const k of Object.keys(done)) if (k < cut) delete done[k];
  if (value) done[date] = value; else delete done[date];
  return applyItemsPatch('plan', { [p.id]: { ...plainItem(p), done } });
}
function planTx(p, date) {
  const base = { type: p.type, date, payee: p.payee || null, comment: p.comment || '', created: Date.now() };
  if (p.type === 'transfer') return { ...base, outAcc: p.acc, outAmt: +p.amt, inAcc: p.to, inAmt: +p.amt2 || +p.amt };
  if (p.type === 'income') return { ...base, inAcc: p.acc, inAmt: +p.amt, cat: p.cat || null };
  return { ...base, outAcc: p.acc, outAmt: +p.amt, cat: p.cat || null };
}
/* planned amounts per category for a month: the budget uses them when no plan is set by hand */
function planMonthByCat(m) {
  const res = { o: new Map(), i: new Map() };
  for (const p of D.plans.values()) {
    if (p.paused || (p.type !== 'expense' && p.type !== 'income') || !p.cat) continue;
    const n = planDates(p, m + '-01', monthEnd(m)).length;
    if (!n) continue;
    const map = p.type === 'expense' ? res.o : res.i;
    map.set(p.cat, (map.get(p.cat) || 0) + planMain(p) * n);

/* ---------- debts: terms and installments ---------- */
function debtId(key) {
  let h = 7;
  for (const ch of String(key)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return 'd' + h.toString(36);
}
function debtOps(key) { return S().txs.filter(t => t.type === 'debt' && t.payee && t.payee.trim().toLowerCase() === key); }
function debtSchedule(e) {
  const meta = D.debtMeta.get(debtId(e.key));
  const entries = Object.entries(e.byCur).filter(([, v]) => Math.abs(v) >= 0.005);
  if (!meta || !entries.length) return null;
  const [cur, bal] = entries[0];
  const owedToMe = bal > 0;
  const remaining = Math.abs(bal);
  let total = 0;
  for (const t of debtOps(e.key)) {
    const out = !!t.outAcc;
    if (accCur(out ? t.outAcc : t.inAcc) !== cur) continue;
    if (owedToMe ? t.debtKind === 'lend' : t.debtKind === 'borrow') total += out ? t.outAmt : t.inAmt;
  }
  total = Math.max(total, remaining);
  const paid = Math.max(0, total - remaining);
  const rows = [];
  const n = Math.round(+meta.n || 0);
  if (n > 1 && meta.first) {
    const per = total / n;
    for (let k = 0; k < n; k++) {
      const covered = Math.min(per, Math.max(0, paid - k * per));
      rows.push({ date: addMonthsISO(meta.first, k), amt: per, left: per - covered, paid: per - covered < 0.5 });
    }
  } else if (meta.due) rows.push({ date: meta.due, amt: remaining, left: remaining, paid: false });
  const next = rows.find(r => !r.paid) || null;
  return { meta, cur, owedToMe, total, paid, remaining, rows, next, overdue: !!(next && next.date < today()) };
}
function debtList() {
  return [...S().debts.values()].filter(e => Object.values(e.byCur).some(v => Math.abs(v) >= 0.005));
}
function debtTermsSave(key, name, patch) {
  const id = debtId(key);
  const cur = D.debtMeta.get(id);
  const next = { ...(cur ? plainItem(cur) : { created: Date.now() }), name, ...patch, updated: Date.now() };
  if (!next.due && !(next.n > 1 && next.first) && !next.note) return applyItemsPatch('debt', { [id]: null });
  return applyItemsPatch('debt', { [id]: next });
}

/* ---------- goals and safety cushion ---------- */
function goalProgress(g) {
  const cur = g.cur || mainCur();
  let saved = +g.saved || 0;
  if (g.acc && D.accounts.has(g.acc)) saved = conv(S().bal.get(g.acc) || 0, accCur(g.acc), cur);
  const target = +g.target || 0;
  const left = Math.max(0, target - saved);
  let perMonth = null, monthsLeft = null;
  if (g.date && left > 0) { monthsLeft = Math.max(1, monthsBetween(today(), g.date) + 1); perMonth = left / monthsLeft; }
  return { cur, saved, target, left, pct: target > 0 ? Math.max(0, Math.min(100, saved / target * 100)) : 0, perMonth, monthsLeft, done: target > 0 && saved >= target - 0.005 };
}
function avgMonthlyExpense(n = 3) {
  const cur = monthKey(today());
  let sum = 0, cnt = 0;
  for (let k = 1; k <= n; k++) { const f = monthFacts(addMonths(cur, -k)); if (f.expTotal > 0) { sum += f.expTotal; cnt++; } }
  if (!cnt) {
    const f = monthFacts(cur);
    const day = Number(today().slice(8, 10));
    if (f.expTotal > 0 && day >= 7) return f.expTotal / day * daysInMonth(cur);
    return 0;
  }
  return sum / cnt;
}
function cushion() {
  let savings = 0;
  for (const a of D.accounts.values()) {
    if (a.archived || a.inBal === false || !(LIQUID_TYPES.has(a.type) || a.type === 'deposit')) continue;
    const b = S().bal.get(a.id) || 0;
    if (b > 0) savings += conv(b, a.cur);
  }
  const exp = avgMonthlyExpense(3);
  return { savings, exp, months: exp > 0 ? savings / exp : null };
}

/* ---------- balance forecast on money you can spend (cash, cards, wallets) ---------- */
const isLiquid = id => { const a = D.accounts.get(id); return !!a && !a.archived && a.inBal !== false && LIQUID_TYPES.has(a.type); };
function forecast(days = 60) {
  const t0 = today(), end = addDays(t0, days);
  let start = 0;
  for (const a of D.accounts.values()) if (isLiquid(a.id)) start += conv(S().bal.get(a.id) || 0, a.cur);
  const ev = new Map();
  const add = (d, v, label) => {
    if (!v) return;
    if (d < t0) d = t0;
    if (d > end) return;
    const e = ev.get(d) || { v: 0, items: [] };
    e.v += v; e.items.push({ label, v });
    ev.set(d, e);
  };
  const loanPlanned = new Set();
  for (const p of D.plans.values()) if (p.type === 'transfer' && p.to && (D.accounts.get(p.to) || {}).type === 'loan') loanPlanned.add(p.to);
  for (const o of planPending(addDays(t0, -45), end)) {
    const p = o.p, v = planMain(p), title = planTitle(p);
    if (p.type === 'expense') { if (isLiquid(p.acc)) add(o.date, -v, title); }
    else if (p.type === 'income') { if (isLiquid(p.acc)) add(o.date, v, title); }
    else if (p.type === 'transfer') { const out = isLiquid(p.acc), inn = isLiquid(p.to); if (out && !inn) add(o.date, -v, title); else if (!out && inn) add(o.date, v, title); }
  }
  for (const e of debtList()) {
    const sch = debtSchedule(e);
    if (!sch) continue;
    for (const r of sch.rows) if (!r.paid && r.left > 0.5) add(r.date, (sch.owedToMe ? 1 : -1) * conv(r.left, sch.cur), (sch.owedToMe ? 'Вернёт ' : 'Вернуть ') + e.name);
  }
  for (const a of D.accounts.values()) {
    if (a.type !== 'loan' || a.archived || loanPlanned.has(a.id)) continue;
    const li = loanInfo(a);
    if (!li || !li.next || !li.pay) continue;
    for (let k = 0, d = li.next; d <= end && k < 12; k++, d = addMonthsISO(li.next, k)) add(d, -conv(li.pay, a.cur), 'Кредит: ' + a.name);
  }
  const dates = [], values = [];
  let v = start, min = { v: start, d: t0 };
  for (let k = 0, d = t0; k <= days; k++, d = addDays(d, 1)) {
    v += (ev.get(d) || {}).v || 0;
    dates.push(d); values.push(v);
    if (v < min.v) min = { v, d };
  }
  const monthEndIdx = dates.indexOf(monthEnd(monthKey(t0)));
  return { dates, values, start, min, last: values[values.length - 1], monthEndV: monthEndIdx >= 0 ? values[monthEndIdx] : null, ev };
}

/* ---------- habit: how long and how regularly the records are kept ---------- */
function localDay(ts) { return toISO(new Date(ts)); }
function recordStats() {
  const st = S();
  if (st.rec) return st.rec;
  const days = new Set();
  let first = null;
  for (const t of st.txs) {
    const d = t.created ? localDay(t.created) : t.date;
    days.add(d);
    if (!first || d < first) first = d;
  }
  for (const q of Object.keys(D.settings.quiet || {})) days.add(q);
  const createdDay = D.settings.created ? localDay(D.settings.created) : null;
  const since = [first, createdDay].filter(Boolean).sort()[0] || today();
  const total = Math.max(1, daysBetween(since, today()) + 1);
  let streak = 0, d = today();
  if (!days.has(d)) d = addDays(d, -1);
  while (days.has(d)) { streak++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  for (const x of [...days].sort()) { run = prev && addDays(prev, 1) === x ? run + 1 : 1; if (run > best) best = run; prev = x; }
  st.rec = { since, total, streak, best, active: days.size, count: st.txs.length, todayHas: days.has(today()) };
  return st.rec;
}
function monthCompare(m) {
  const cur = monthFacts(m), prev = monthFacts(addMonths(m, -1));
  const top = rollup(cur.exp), topPrev = rollup(prev.exp);
  const ids = new Set([...top.keys(), ...topPrev.keys()]);
  const changes = [...ids].map(id => ({ id, now: top.get(id) || 0, was: topPrev.get(id) || 0 })).map(x => ({ ...x, d: x.now - x.was })).filter(x => Math.abs(x.d) > 0.5);
  changes.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  return { cur, prev, changes: changes.slice(0, 4) };
}

}

/* ---------- payments: list, calendar, forecast ---------- */

  const pi = planIcon(p);
  const lo = planSince(p) > today() ? planSince(p) : today();
  const next = planDates(p, lo, addDays(today(), 800), 60).find(d => !(p.done && p.done[d]));
  const sub = [freqText(p), p.paused ? 'на паузе' : (next ? 'следующий ' + shortDate(next) : 'завершён')].join(' · ');
  return html`<button class="row" data-act="edit-plan" data-id="${p.id}"><span class="ico" style="--c:${safeColor(pi.color)}">${pi.icon}</span>
    <span class="row-main"><span class="row-title">${planTitle(p)}</span><span class="row-sub">${sub}</span></span>
    <span class="row-amt ${p.type === 'income' ? 'pos' : p.type === 'transfer' ? 'mute' : ''}"><span>${p.type === 'income' ? '+' : ''}${money(+p.amt, accCur(p.acc))}</span></span></button>`;
}
function renderPlans() {
  const v = UI.plans.view;
  const seg = html`<div class="seg" role="tablist" aria-label="Вид">${[['list', 'Список'], ['cal', 'Календарь'], ['fc', 'Прогноз']].map(([k, l]) => html`<button role="tab" aria-selected="${String(!!(v === k))}" class="${v === k ? 'on' : ''}" data-act="plans-view" data-v="${k}">${l}</button>`)}</div>`;

    return html`${seg}${emptyCard('Регулярных платежей пока нет', 'Добавьте аренду, связь, подписки или зарплату. Regalia напомнит о них, покажет в календаре и учтёт в прогнозе баланса.', html`<button class="btn primary" data-act="new-plan">${icon('plus')}<span>Добавить платёж</span></button>`)}`;

    <div class="stat"><span class="label">Регулярные доходы</span><b class="pos">${money(inc)}</b><span class="small muted">в месяц</span></div>
  </div></section>`;
  const up = upcomingItems(30);
  const upBlock = up.length ? html`<section class="group"><div class="section-h"><span>Ближайшие 30 дней</span><span>${up.length}</span></div><div class="card list">${up.map(upRow)}</div></section>` : '';
  return html`${seg}${summary}${upBlock}<section class="group"><div class="section-h"><span>Все регулярные</span><span>${plans.length}</span></div><div class="card list">${plans.map(planRow)}</div></section>
    <div class="btn-row"><button class="btn line" data-act="new-plan">${icon('plus')}<span>Добавить платёж</span></button></div>`;
}
function renderPlanCalendar() {
  const m = UI.plans.month;
  const first = parseISO(m + '-01');
  const lead = (first.getDay() + 6) % 7;
  const dim = daysInMonth(m);
  const t = today();
  const spent = new Map(), inc = new Map();
  for (const tx of txInRange(m + '-01', monthEnd(m))) {
    if (tx.type === 'expense') spent.set(tx.date, (spent.get(tx.date) || 0) + txAmountMain(tx));
    else if (tx.type === 'income') inc.set(tx.date, (inc.get(tx.date) || 0) + txAmountMain(tx));
  }
  const planned = new Map();
  const lo = m + '-01' < t ? t : m + '-01';
  for (const o of planPending(lo, monthEnd(m))) { const e = planned.get(o.date) || []; e.push(o); planned.set(o.date, e); }
  for (const e of debtList()) { const sch = debtSchedule(e); if (!sch) continue; for (const r of sch.rows) if (!r.paid && monthKey(r.date) === m && r.date >= t) { const x = planned.get(r.date) || []; x.push({ debt: e, r, sch }); planned.set(r.date, x); } }
  const sel = UI.plans.day && monthKey(UI.plans.day) === m ? UI.plans.day : (monthKey(t) === m ? t : null);
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(html`<span class="cal-cell empty"></span>`);
  for (let d = 1; d <= dim; d++) {
    const iso = `${m}-${pad(d)}`;
    const sp = spent.get(iso) || 0, pl = planned.get(iso);
    cells.push(html`<button class="cal-cell ${iso === t ? 'today' : ''} ${iso === sel ? 'sel' : ''}" data-act="cal-day" data-v="${iso}" aria-label="${dayTitle(iso)}${sp ? ', потрачено ' + money(sp) : ''}${pl ? ', запланировано ' + pl.length : ''}">
      <span class="cal-d">${d}</span>${sp ? html`<span class="cal-v">${fmtCompact(sp)}</span>` : ''}${pl ? html`<span class="cal-dot"></span>` : ''}</button>`);
  }
  let detail = '';
  if (sel) {
    const txs = S().txs.filter(x => x.date === sel);
    const pl = planned.get(sel) || [];
    detail = html`<section class="group"><div class="section-h"><span>${dayTitle(sel)}</span><span class="num">${spent.get(sel) ? MINUS + money(spent.get(sel)) : ''}${inc.get(sel) ? ' +' + money(inc.get(sel)) : ''}</span></div>
      ${pl.length ? html`<div class="card list">${pl.map(o => o.p ? upRow({ kind: 'plan', date: o.date, overdue: o.overdue, p: o.p, title: planTitle(o.p), amt: money(+o.p.amt, accCur(o.p.acc)), type: o.p.type, ...planIcon(o.p) }) : upRow({ kind: 'debt', date: o.r.date, overdue: false, key: o.debt.key, title: (o.sch.owedToMe ? 'Вернёт ' : 'Вернуть: ') + o.debt.name, amt: money(o.r.left, o.sch.cur), type: o.sch.owedToMe ? 'income' : 'expense', icon: gi('g:handshake'), color: '#4C7BE0' }))}</div>` : ''}
      ${txs.length ? html`<div class="card list" style="margin-top:8px">${txs.map(x => txRow(x))}</div>` : (!pl.length ? html`<div class="card empty small muted">В этот день записей и платежей нет</div>` : '')}
    </section>`;
  }
  const monthSpent = [...spent.values()].reduce((a, b) => a + b, 0);
  return html`<div class="month-nav"><button class="icon-btn" data-act="cal-month" data-d="-1" aria-label="Предыдущий месяц">${icon('left')}</button><span class="m">${monthTitle(m)}</span><button class="icon-btn" data-act="cal-month" data-d="1" aria-label="Следующий месяц">${icon('right')}</button></div>
    <section class="card cal">
      <div class="cal-wd">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => html`<span>${w}</span>`)}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend"><span><i class="cal-dot"></i>запланировано</span><span>цифры: потрачено за день · всего ${money(monthSpent)}</span></div>
    </section>${detail}`;
}
function renderForecast() {
  const f = forecast(60);

  const neg = f.min.v < 0;
  const card = html`<section class="card summary"><div class="sum-grid">
      <div class="stat"><span class="label">Сейчас</span><b>${money(f.start)}</b></div>
      ${f.monthEndV !== null ? html`<div class="stat"><span class="label">К концу месяца</span><b class="${f.monthEndV < 0 ? 'neg' : ''}">${money(f.monthEndV)}</b></div>` : ''}

    </div>
    <div class="note-line">${icon(neg ? 'warn' : 'info')}<span>${neg ? html`Денег может не хватить ${shortDate(f.min.d)}: прогноз ${money(f.min.v)}` : html`Минимум за период: ${money(f.min.v)}, ${shortDate(f.min.d)}`}</span></div>
  </section>`;
  const chart = html`<section class="card"><div class="card-h"><h2>Прогноз баланса</h2><span class="small muted">наличные и карты</span></div><div class="chart-wrap">${dayLineChart('fc', f.dates, f.values)}</div></section>`;
  const list = evs.length ? html`<section class="group"><div class="section-h"><span>Что учтено</span><span>${evs.length} ${plural(evs.length, 'день', 'дня', 'дней')}</span></div><div class="card list">${evs.slice(0, 20).map(([d, e]) => html`<div class="row simple"><span class="ico sm" style="--c:${e.v >= 0 ? 'var(--pos)' : 'var(--neg)'}">${icon(e.v >= 0 ? 'up' : 'down')}</span><span class="row-main"><span class="row-title">${e.items.map(x => x.label).join(', ')}</span><span class="row-sub">${dayTitle(d)}</span></span><span class="row-amt ${e.v >= 0 ? 'pos' : ''}">${money(e.v, mainCur(), { sign: true })}</span></div>`)}</div></section>`
    : emptyCard('Прогнозу пока не на что опереться', 'Добавьте регулярные платежи, сроки по долгам или кредит со ставкой и сроком, и Regalia покажет, сколько денег будет на счетах.', html`<button class="btn primary" data-act="new-plan">${icon('plus')}<span>Добавить платёж</span></button>`);
  return html`${card}${chart}${list}`;

  let monthIn = 0, monthOut = 0;
  const me = monthEnd(monthKey(today()));

  for (const { sch } of rows) if (sch) for (const r of sch.rows) if (!r.paid && r.date <= me) { if (sch.owedToMe) monthIn += conv(r.left, sch.cur); else monthOut += conv(r.left, sch.cur); }
  rows.sort((a, b) => ((b.sch && b.sch.overdue) ? 1 : 0) - ((a.sch && a.sch.overdue) ? 1 : 0) || ((a.sch && a.sch.next ? a.sch.next.date : '9') < (b.sch && b.sch.next ? b.sch.next.date : '9') ? -1 : 1) || (b.e.last > a.e.last ? 1 : -1));
  const summary = html`<section class="card summary"><div class="sum-grid">

  </div>${monthIn || monthOut ? html`<div class="note-line">${icon('calendar')}<span>До конца месяца по графику: ${monthIn ? html`<b class="pos">+${money(monthIn)}</b> вам вернут` : ''}${monthIn && monthOut ? ', ' : ''}${monthOut ? html`<b>${money(monthOut)}</b> вернёте вы` : ''}</span></div>` : ''}</section>`;
  return html`${summary}<section class="card list">${rows.map(x => debtRow(x.e))}</section>

}

/* ---------- reports additions ---------- */
function donutBlock(map, kind) {
  const drill = UI.rep.drill && D.categories.has(UI.rep.drill) && D.categories.get(UI.rep.drill).kind === kind ? UI.rep.drill : null;
  let entries = drill ? [[drill, map.get(drill) || 0], ...childCats(drill).map(k => [k.id, map.get(k.id) || 0])] : [...rollup(map).entries()];
  entries = entries.filter(([, v]) => v > 0.5).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '';
  const top = entries.slice(0, 7);
  const rest = entries.slice(7).reduce((s2, [, v]) => s2 + v, 0);
  const seg = top.map(([id, v]) => { const c = D.categories.get(id); return { id, v, color: safeColor(c ? c.color : NEUTRAL), label: c ? (drill && id === drill ? c.name + ': без подкатегории' : c.name) : 'Без категории' }; });
  if (rest > 0.5) seg.push({ id: '__rest', v: rest, color: NEUTRAL, label: `Остальные (${entries.length - 7})` });
  const total = entries.reduce((s2, [, v]) => s2 + v, 0);
  return html`<div class="donut-wrap">${donutChart('donut', seg, total, kind === 'income' ? 'доходы' : 'расходы')}</div>`;
}
function compareCard(m) {
  const c = monthCompare(m);
  if (!c.prev.expTotal || !c.cur.list.length) return '';
  const d = (c.cur.expTotal - c.prev.expTotal) / c.prev.expTotal * 100;
  const isCur = m === monthKey(today());
  return html`<section class="card">
    <div class="card-h"><h2>Сравнение с прошлым месяцем</h2></div>
    <div class="px"><div class="note-line">${icon(d > 0 ? 'up' : 'down')}<span>Расходы ${isCur ? 'пока ' : ''}${Math.abs(d) < 1 ? 'почти такие же' : html`на <b class="${d > 0 ? 'neg' : 'pos'}">${Math.abs(Math.round(d))}%</b> ${d > 0 ? 'больше' : 'меньше'}`}: ${money(c.cur.expTotal)} против ${money(c.prev.expTotal)}${isCur ? ' за весь прошлый месяц' : ''}</span></div></div>
    ${c.changes.length ? html`<div class="rank">${c.changes.map(x => { const cc = D.categories.get(x.id); return html`<div class="rank-row static"><span class="ico sm" style="--c:${safeColor(cc ? cc.color : NEUTRAL)}">${gi(cc ? cc.icon : 'g:dots-horizontal')}</span><span class="rank-main"><span class="rank-top"><span class="name">${cc ? cc.name : 'Без категории'}</span><span class="num ${x.d > 0 ? 'neg' : 'pos'}">${x.d > 0 ? '+' : MINUS}${money(Math.abs(x.d))}</span></span><span class="small muted">${money(x.now)} против ${money(x.was)}</span></span><span></span></div>`; })}</div>` : ''}
  </section>`;
}

function loanPaySave(s) {
  const a = D.accounts.get(s.props.id);
  const st = s.st;
  if (!a) return Sheets.close(s);
  if (!st.from || !D.accounts.has(st.from)) return sheetErr(s, 'Выберите счёт списания');
  const total = round2(evalExpr(st.totalExpr)), int = round2(evalExpr(st.intExpr)) || 0;
  if (!(total > 0)) return sheetErr(s, 'Введите сумму платежа');
  if (int < 0 || int > total) return sheetErr(s, 'Проценты не могут быть больше платежа');
  const from = D.accounts.get(st.from);
  const princ = round2(total - int);
  const k = v => (from.cur === a.cur ? v : round2(conv(v, a.cur, from.cur)));
  const cat = [...D.categories.values()].find(c => c.kind === 'expense' && /кредит/i.test(c.name));
  const ps = [];
  if (princ > 0) ps.push(saveTx({ id: uid(), type: 'transfer', date: st.date || today(), outAcc: from.id, outAmt: k(princ), inAcc: a.id, inAmt: princ, comment: 'Платёж по кредиту', created: Date.now() }, null));
  if (int > 0) ps.push(saveTx({ id: uid(), type: 'expense', date: st.date || today(), outAcc: from.id, outAmt: k(int), cat: cat ? cat.id : null, payee: a.bank || a.name, comment: 'Проценты по кредиту', created: Date.now() }, null));
  Sheets.close(s);
  toast('Платёж по кредиту записан');
  return Promise.all(ps);
}

function loanCalcOut(st) {

function normDraft(o) {
  if (!o || typeof o !== 'object') return null;
  const type = ['expense', 'income', 'transfer'].includes(o.type) ? o.type : 'expense';
  const amount = round2(Math.abs(parseNum(o.amount)));
  if (!(amount > 0)) return null;
  const cur = String(o.currency || '').toUpperCase().slice(0, 3) || mainCur();
  const date = isoOk(o.date) ? o.date : today();
  let acc = o.account && D.accounts.has(String(o.account)) ? String(o.account) : null;
  if (!acc) { const a = accountsSorted().find(x => x.cur === cur && x.type !== 'loan'); acc = a ? a.id : defaultAcc(type); }
  if (!acc) return null;
  let to = type === 'transfer' && o.toAccount && D.accounts.has(String(o.toAccount)) ? String(o.toAccount) : null;
  let t = type;
  if (t === 'transfer' && (!to || to === acc)) t = 'expense';
  const catOk = id => { const c = id && D.categories.get(String(id)); return c && c.kind === (t === 'income' ? 'income' : 'expense') ? c.id : null; };
  let parts = null;
  if (Array.isArray(o.parts) && o.parts.length > 1 && t !== 'transfer') {
    parts = o.parts.map(p => ({ cat: catOk(p && p.category), amt: round2(Math.abs(parseNum(p && p.amount))) })).filter(p => p.amt > 0);
    const sum = round2(parts.reduce((x, p) => x + p.amt, 0));
    if (parts.length < 2 || Math.abs(sum - amount) > 0.01 * Math.max(1, amount)) parts = null;
    else if (Math.abs(sum - amount) > 0.009) parts[parts.length - 1].amt = round2(parts[parts.length - 1].amt + amount - sum);
  }
  const ac = accCur(acc);
  let amt = amount, opAmt = null, opCur = null;
  if (cur !== ac && CURRENCIES[cur]) { const v = conv(amount, cur, ac); if (v > 0) { amt = round2(v); opAmt = amount; opCur = cur; if (parts) parts = null; } }
  return {
    inc: true, added: false, type: t, amount: amt, acc, to, cat: parts ? null : catOk(o.category), parts, date,
    payee: o.payee ? String(o.payee).trim().slice(0, 120) : '', comment: o.comment ? String(o.comment).trim().slice(0, 200) : '', opAmt, opCur,
  };
}
function draftTx(d) {
  const base = { type: d.type, date: d.date, payee: d.payee || null, comment: d.comment || '', created: Date.now(), cat: d.cat || null, parts: d.parts || null };
  if (d.type === 'transfer') return { ...base, payee: null, cat: null, parts: null, outAcc: d.acc, outAmt: d.amount, inAcc: d.to, inAmt: accCur(d.acc) === accCur(d.to) ? d.amount : round2(conv(d.amount, accCur(d.acc), accCur(d.to))) };
  if (d.type === 'income') return { ...base, inAcc: d.acc, inAmt: d.amount };
  return { ...base, outAcc: d.acc, outAmt: d.amount, opAmt: d.opAmt, opCur: d.opCur };
}

async function aiParse(s) {
  const st = s.st;
  const text = (st.text || '').trim();

  if (!aiOn()) return sheetErr(s, aiErrText('capability_disabled'));

  st.ctl = ctl;
  renderSheet(s);

    const opts = { signal: ctl.signal };
    if (st.files.length) opts.images = st.files;
    const res = await AI.sample.json(aiParsePrompt(text, st.files.length), opts);
    const ops = Array.isArray(res) ? res : (res && Array.isArray(res.ops) ? res.ops : []);

}

function mdLite(t) {
  const fmt = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let out = '', inList = false;
  for (const ln of String(t || '').split('\n')) {
    const m = ln.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + fmt(m[1]) + '</li>'; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (!ln.trim()) continue;
    const h = ln.match(/^#{1,4}\s+(.*)$/);
    out += h ? '<p><b>' + fmt(h[1]) + '</b></p>' : '<p>' + fmt(ln) + '</p>';
  }
  if (inList) out += '</ul>';
  return raw(out);
}

  if (UI.ai.scroll) { UI.ai.scroll = false; const main = $('#main'); if (main) main.scrollTop = main.scrollHeight; }
}
async function aiSend(text) {
  const a = UI.ai;
  const q = String(text || '').trim();
  if (!q || a.busy || !aiOn()) return;
  a.turns.push({ role: 'user', content: q.slice(0, 4000) });
  a.turns.push({ role: 'assistant', content: '' });
  a.draft = '';
  a.busy = true; a.scroll = true;
  const ctl = new AbortController();
  a.ctl = ctl;
  render();
  const hist = a.turns.slice(0, -1).filter(t => t.content && !t.err).slice(-12);
  const input = [{ role: 'user', content: aiRules() }, ...hist.map(t => ({ role: t.role, content: t.content }))];
  const bot = a.turns[a.turns.length - 1];
  try {
    const opts = { cache: false, signal: ctl.signal, onText: ({ text: tx }) => { bot.content = tx; const el = $('#ai-live'); if (el) el.textContent = tx; const main = $('#main'); if (main) main.scrollTop = main.scrollHeight; } };
    const tools = aiTools();
    if (tools) opts.tools = tools;
    const res = await AI.sample(input, opts);
    bot.content = res.text;
    if (res.truncated) bot.err = 'Ответ оборвался, спросите короче.';
  } catch (e) {
    const code = e && e.code;
    if (AI_HIDE.has(code)) AI.denied = true;
    bot.content = (e && e.text) || '';
    const msg = aiErrText(code);
    if (msg) bot.err = msg;
    if (!bot.content && !bot.err) a.turns.splice(-2, 2);
  }
  a.busy = false; a.ctl = null; a.scroll = true;
  render();
}

/* ================= installed build (PWA): data on the device, CBU rates, updates by patch ================= */
const FX_KEY = 'regalia.fx';
const UPD = { ready: false };

function pwaBoot() {
  try {
    if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { if (!p && navigator.storage.persist) navigator.storage.persist(); }).catch(() => {});
  } catch (e) { /* not supported */ }
  try { const fx = JSON.parse(localStorage.getItem(FX_KEY) || 'null'); if (fx && fx.r && typeof fx.d === 'string') D.market = { fx }; } catch (e) { /* broken cache */ }
  if (window.__regaliaUpdateReady) UPD.ready = true;
  window.addEventListener('regalia-update', () => { UPD.ready = true; bump(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pwaCheckUpdate(false); pwaFetchRates(); } });
  pwaFetchRates();
}

/* official CBU rates once a day; if the site does not answer, the built-in rates stay */
async function pwaFetchRates() {
  if (!navigator.onLine || PREFS.fxTry === today()) return;
  PREFS.fxTry = today(); savePrefs();
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    const res = await fetch('https://cbu.uz/ru/arkhiv-kursov-valyut/json/', { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (!res.ok) return;
    const list = await res.json();
    const r = {};
    let d = '';
    for (const x of Array.isArray(list) ? list : []) {
      const rate = parseFloat(String(x.Rate || '').replace(',', '.'));
      const nom = parseFloat(x.Nominal) || 1;
      if (x.Ccy && rate > 0) r[x.Ccy] = Math.round(rate / nom * 10000) / 10000;
      if (!d && /^\d{2}\.\d{2}\.\d{4}$/.test(x.Date || '')) { const [dd, mm, yy] = x.Date.split('.'); d = `${yy}-${mm}-${dd}`; }
    }
    if (!r.USD || !d) return;
    if (MKT().fx.d > d) return;
    const fx = { d, r };
    localStorage.setItem(FX_KEY, JSON.stringify(fx));
    D.market = { fx };
    bump();
  } catch (e) { /* offline or blocked by the site */ }
}

function pwaCheckUpdate(manual) {
  const reg = window.__regaliaReg;
  if (!reg) { if (manual) toast('Проверка обновлений работает в установленном приложении'); return; }
  if (manual) toast('Проверяю обновления…');
  reg.update().then(() => {
    if (!manual) return;
    setTimeout(() => { if (!UPD.ready && !reg.installing && !reg.waiting) toast('У вас последняя версия'); }, 2500);
  }).catch(() => { if (manual) toast('Нет связи, проверю позже', { error: true }); });
}
function pwaApplyUpdate() {
  const reg = window.__regaliaReg;
  if (reg && reg.waiting) { toast('Обновляю…'); reg.waiting.postMessage({ type: 'SKIP_WAITING' }); setTimeout(() => location.reload(), 4000); }
  else location.reload();
}

function backupDue() {
  if (!PWA || needsOnboarding() || !S().txs.length) return false;
  if (PREFS.backupSnooze && daysBetween(PREFS.backupSnooze, today()) < 3) return false;
  return !PREFS.lastBackup || daysBetween(PREFS.lastBackup, today()) >= 14;
}
function pwaBanners() {
  const out = [];
  if (UPD.ready) out.push(html`<div class="banner upd">${icon('download')}<span>Готово обновление Regalia. Данные сохранятся. <button class="link" data-act="app-update">Обновить</button></span></div>`);
  if (backupDue()) out.push(html`<div class="banner">${icon('info')}<span>${PREFS.lastBackup ? `Последняя резервная копия ${fmtDayShort(PREFS.lastBackup)}.` : 'Данные хранятся только на этом устройстве.'} Сохраните копию, это 10 секунд. <button class="link" data-act="export-json">Сохранить</button> · <button class="link" data-act="backup-later">Позже</button></span></div>`);
  return out;
}
function fmtDayShort(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'][m - 1]}${y !== curYear() ? ' ' + y : ''}`;
}
function pwaAboutCard() {
  if (!PWA) return '';
  const build = window.REGALIA_BUILD || APP_VERSION;
  return html`<section class="card pad stack">
    <h2 style="font-size:16px">Обновления</h2>
    <p class="prose" style="margin:0">Версия ${build}. Когда выйдет патч, сверху появится "Готово обновление". Данные при обновлении не трогаются.</p>
    <button class="btn line" data-act="check-update">${icon('restore')}<span>Проверить обновления</span></button>
  </section>`;
}
